<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="popcorn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cup-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="stripe-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
  </defs>
  
  <!-- Soft Background Glow Circle -->
  <circle cx="32" cy="32" r="30" fill="#171717" stroke="#f59e0b" stroke-width="2" />

  <!-- Popcorn Kernels / Puffs -->
  <circle cx="24" cy="22" r="7" fill="url(#popcorn-grad)" />
  <circle cx="32" cy="18" r="8" fill="#fef08a" />
  <circle cx="40" cy="22" r="7" fill="url(#popcorn-grad)" />
  <circle cx="28" cy="15" r="6" fill="#fef08a" />
  <circle cx="36" cy="15" r="6" fill="url(#popcorn-grad)" />

